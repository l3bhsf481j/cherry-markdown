name: Publish Client Dev Preview on PR Merge
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  actions: read
  issues: write
jobs:
  client-preview:
    if: github.repository == 'l3bhsf481j/cherry-markdown' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev'
    name: client-${{ matrix.platform_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
        - platform: macos-latest
          target: aarch64-apple-darwin
          platform_name: macos
          arch: arm64
          args: --target aarch64-apple-darwin
        - platform: macos-latest
          target: x86_64-apple-darwin
          platform_name: macos
          arch: x64
          args: --target x86_64-apple-darwin
        - platform: windows-latest
          target: x86_64-pc-windows-msvc
          platform_name: windows
          arch: x64
          args: --target x86_64-pc-windows-msvc
        - platform: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          platform_name: linux
          arch: x64
          args: --target x86_64-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: yarn
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: ${{ matrix.target }}
        toolchain: stable
    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/client/src-tauri -> target
        save-if: false
    - name: Install Linux Dependencies
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - name: Get Version
      id: version
      shell: bash
      run: |
        VERSION=$(node -p "require('./packages/client/package.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    - name: Install Dependencies
      run: yarn --network-timeout 100000
    - name: Build Cherry Markdown
      run: yarn build
    - name: Build Tauri Client
      run: yarn build:client ${{ matrix.args }}
    - name: Collect and Upload Artifacts
      id: artifacts
      shell: bash
      run: |
        mkdir -p ./artifact-info
        VERSION="${{ steps.version.outputs.version }}"
        PLATFORM="${{ matrix.platform_name }}"
        ARCH="${{ matrix.arch }}"
        TARGET="${{ matrix.target }}"
        TARGET_DIR="./packages/client/src-tauri/target/$TARGET/release/bundle"

        # 创建产物信息文件
        echo "version=$VERSION" > ./artifact-info/build-info.txt
        echo "platform=$PLATFORM" >> ./artifact-info/build-info.txt
        echo "arch=$ARCH" >> ./artifact-info/build-info.txt
        echo "target=$TARGET" >> ./artifact-info/build-info.txt

        # 收集所有产物文件名
        > ./artifact-info/files.txt
        if [ -d "$TARGET_DIR" ]; then
          find "$TARGET_DIR" -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) | while read file; do
            basename "$file" >> ./artifact-info/files.txt
          done
          find "$TARGET_DIR" -type d -name "*.app" | while read dir; do
            basename "$dir" >> ./artifact-info/files.txt
          done
        fi

        echo "Build Info:"
        cat ./artifact-info/build-info.txt
        echo "Artifacts:"
        cat ./artifact-info/files.txt
    - name: Upload DMG
      if: matrix.platform_name == 'macos'
      uses: actions/upload-artifact@v4
      with:
        name: cherry-markdown-${{ steps.version.outputs.version }}-${{ matrix.platform_name }}-${{ matrix.arch }}-dmg
        path: ./packages/client/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
        retention-days: 7
        if-no-files-found: error
    - name: Upload App
      if: matrix.platform_name == 'macos'
      uses: actions/upload-artifact@v4
      with:
        name: cherry-markdown-${{ steps.version.outputs.version }}-${{ matrix.platform_name }}-${{ matrix.arch }}-app
        path: ./packages/client/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
        retention-days: 7
        if-no-files-found: error
    - name: Upload MSI
      if: matrix.platform_name == 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: cherry-markdown-${{ steps.version.outputs.version }}-${{ matrix.platform_name }}-${{ matrix.arch }}-msi
        path: ./packages/client/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
        retention-days: 7
        if-no-files-found: error
    - name: Upload NSIS Installer
      if: matrix.platform_name == 'windows'
      uses: actions/upload-artifact@v4
      with:
        name: cherry-markdown-${{ steps.version.outputs.version }}-${{ matrix.platform_name }}-${{ matrix.arch }}-exe
        path: ./packages/client/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
        retention-days: 7
        if-no-files-found: error
    - name: Upload AppImage
      if: matrix.platform_name == 'linux'
      uses: actions/upload-artifact@v4
      with:
        name: cherry-markdown-${{ steps.version.outputs.version }}-${{ matrix.platform_name }}-${{ matrix.arch }}-appimage
        path: ./packages/client/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
        retention-days: 7
        if-no-files-found: error
    - name: Upload Deb
      if: matrix.platform_name == 'linux'
      uses: actions/upload-artifact@v4
      with:
        name: cherry-markdown-${{ steps.version.outputs.version }}-${{ matrix.platform_name }}-${{ matrix.arch }}-deb
        path: ./packages/client/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
        retention-days: 7
        if-no-files-found: error
    - name: Upload Artifact Info
      uses: actions/upload-artifact@v4
      with:
        name: artifact-info-${{ matrix.platform_name }}-${{ matrix.arch }}
        path: ./artifact-info/
        retention-days: 7
  post-preview-comment:
    needs: client-preview
    runs-on: ubuntu-latest
    if: github.repository == 'l3bhsf481j/cherry-markdown'
    steps:
    - name: Download All Artifact Info
      uses: actions/download-artifact@v4
      with:
        pattern: artifact-info-*
        path: ./artifact-info
    - name: Generate PR Comment with Cherry-Markdown Artifacts
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: "const fs = require('fs');\nconst path = require('path');\nconst owner = context.repo.owner;\nconst repo = context.repo.repo;\nconst runId = context.runId;\nconst runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;\n\n// 获取本次 workflow run 的所有 artifacts\nconst { data: artifactList } = await github.rest.actions.listWorkflowRunArtifacts({\n  owner,\n  repo,\n  run_id: runId\n});\n\n// 构建 artifact 名称到下载链接的映射\nconst artifactDownloadUrls = {};\nfor (const artifact of artifactList.artifacts) {\n  artifactDownloadUrls[artifact.name] = `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${artifact.id}`;\n}\n\n// 读取构建信息\nconst artifactInfoDir = './artifact-info';\nconst buildInfos = [];\n\nif (fs.existsSync(artifactInfoDir)) {\n  const dirs = fs.readdirSync(artifactInfoDir);\n  \n  for (const dir of dirs) {\n    const buildInfoPath = path.join(artifactInfoDir, dir, 'build-info.txt');\n    \n    if (fs.existsSync(buildInfoPath)) {\n      const buildInfo = {};\n      const buildInfoContent = fs.readFileSync(buildInfoPath, 'utf8');\n      buildInfoContent.split('\\n').forEach(line => {\n        const [key, value] = line.split('=');\n        if (key && value) {\n          buildInfo[key.trim()] = value.trim();\n        }\n      });\n      buildInfos.push(buildInfo);\n    }\n  }\n}\n\n// 生成评论内容\nlet body = '## \U0001F4BB Cherry-Markdown Client 预览构建已完成\\n\\n';\n\nif (buildInfos.length === 0) {\n  body += '> ⚠️ 未找到构建产物，请检查构建日志。\\n\\n';\n  body += `[查看构建详情](${runUrl})\\n`;\n} else {\n  const version = buildInfos[0]?.version || 'unknown';\n  \n  // 定义产物类型映射\n  const artifactTypes = {\n    'macos': [\n      { suffix: 'dmg', label: 'DMG 安装包' },\n      { suffix: 'app', label: 'App 应用' }\n    ],\n    'windows': [\n      { suffix: 'msi', label: 'MSI 安装包' },\n      { suffix: 'exe', label: 'EXE 安装程序' }\n    ],\n    'linux': [\n      { suffix: 'appimage', label: 'AppImage' },\n      { suffix: 'deb', label: 'Deb 包' }\n    ]\n  };\n\n  // 按平台分组\n  const platformOrder = ['macOS', 'Windows', 'Linux'];\n  const platformMap = { 'macos': 'macOS', 'windows': 'Windows', 'linux': 'Linux' };\n  \n  // 生成表格\n  body += '| 平台 | 架构 | 产物类型 | 下载 |\\n';\n  body += '|------|------|----------|------|\\n';\n  \n  for (const info of buildInfos) {\n    const platform = info.platform;\n    const arch = info.arch;\n    const platformLabel = platformMap[platform] || platform;\n    const archLabel = arch === 'arm64' ? 'Apple Silicon' : 'x64';\n    const types = artifactTypes[platform] || [];\n    \n    for (const type of types) {\n      const artifactName = `cherry-markdown-${version}-${platform}-${arch}-${type.suffix}`;\n      const downloadUrl = artifactDownloadUrls[artifactName] || `${runUrl}`;\n      body += `| ${platformLabel} | ${archLabel} | ${type.label} | [下载](${downloadUrl}) |\\n`;\n    }\n  }\n  \n  body += `\\n> \U0001F4CB 版本: \\`${version}\\` | ⏰ 产物保留 7 天 | [查看所有构建产物](${runUrl})\\n`;\n}\n\n// 查找现有的 Cherry-Markdown Client 预览构建评论\nconst { data: comments } = await github.rest.issues.listComments({\n  issue_number: context.issue.number,\n  owner: owner,\n  repo: repo\n});\n\nconst botComment = comments.find(comment => \n  comment.user.type === 'Bot' && \n  comment.body.includes('\U0001F4BB Cherry-Markdown Client 预览构建')\n);\n\nif (botComment) {\n  // 更新现有评论\n  await github.rest.issues.updateComment({\n    comment_id: botComment.id,\n    owner: owner,\n    repo: repo,\n    body: body\n  });\n  console.log(`Updated existing comment: ${botComment.id}`);\n} else {\n  // 创建新评论\n  await github.rest.issues.createComment({\n    issue_number: context.issue.number,\n    owner: owner,\n    repo: repo,\n    body: body\n  });\n  console.log('Created new comment');\n}\n"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - closed
    paths:
    - packages/client/**
    - packages/cherry-markdown/**
    - '!packages/cherry-markdown/test/**'
